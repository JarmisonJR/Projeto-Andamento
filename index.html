<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technician PRO | Gestão de Manutenção</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <div id="settings-bar">
        <button onclick="toggleTheme()" title="Alternar Tema">
            <i class="fas fa-moon" id="theme-icon"></i>
        </button>
    </div>

    <div id="auth-screen" class="screen flex-center">
        <div class="auth-card animate-in">
            <div class="auth-header">
                <div class="logo-circle"><i class="fas fa-bolt"></i></div>
                <h1 id="auth-title">Technician PRO</h1>
                <p id="auth-subtitle">Entre para gerenciar sua oficina</p>
            </div>
            
            <form id="auth-form" onsubmit="event.preventDefault(); handleAuth();">
                <div id="register-fields" class="hidden">
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="reg-nome" placeholder="Nome Completo">
                    </div>
                    <div class="input-wrapper">
                        <i class="fas fa-id-badge"></i>
                        <select id="reg-cargo">
                            <option value="Técnico Master">Técnico Master</option>
                            <option value="Atendente">Atendente</option>
                            <option value="Administrador">Administrador</option>
                        </select>
                        <i class="fas fa-chevron-down select-arrow"></i>
                    </div>
                </div>

                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="auth-email" placeholder="E-mail" required>
                </div>

                <div class="input-wrapper">
                    <i class="fas fa-key"></i>
                    <input type="password" id="auth-pass" placeholder="Senha" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility('auth-pass', this)"></i>
                </div>
                
                <button type="submit" class="btn-main" id="btn-submit">Entrar no Sistema</button>
            </form>
            
            <button class="btn-toggle" onclick="toggleAuthMode()" id="auth-toggle">
                Não tem conta? <span>Cadastre-se</span>
            </button>
        </div>
    </div>

    <div id="main-layout" class="hidden">
        <button id="mobile-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo">
                <i class="fas fa-bolt"></i> <span>Technician PRO</span>
            </div>
            <nav class="nav-menu">
                <button onclick="showScreen('home-screen')" class="nav-item active">
                    <i class="fas fa-home"></i> <span>Início</span>
                </button>
                <button onclick="showScreen('cadastro-screen')" class="nav-item">
                    <i class="fas fa-plus-circle"></i> <span>Novo Registro</span>
                </button>
                <button onclick="showScreen('lista-screen')" class="nav-item">
                    <i class="fas fa-clipboard-list"></i> <span>Ordens</span>
                </button>
            </nav>
            <div class="sidebar-footer">
                <button onclick="logout()" class="nav-item btn-logout">
                    <i class="fas fa-power-off"></i> <span>Sair da Conta</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <section id="home-screen" class="content-section">
                <div class="welcome-header">
                    <h2 id="welcome-text">Seja Bem-Vindo!</h2>
                    <p id="current-date" class="text-muted"></p>
                </div>
                <div class="welcome-banner">
                    <h1>Technician PRO <small>v1.0</small></h1>
                    <p>Gestão profissional para sua assistência técnica.</p>
                </div>
                <div class="stats-grid">
                    <button class="stat-card" onclick="showScreen('cadastro-screen')">
                        <div class="stat-icon blue"><i class="fas fa-file-signature"></i></div>
                        <div><h3>Nova Ordem</h3><p>Abrir chamado</p></div>
                    </button>
                    <button class="stat-card" onclick="showScreen('lista-screen')">
                        <div class="stat-icon yellow"><i class="fas fa-database"></i></div>
                        <div><h3 id="count-total">0</h3><p>Registros Totais</p></div>
                    </button>
                </div>
            </section>

            <section id="lista-screen" class="content-section hidden">
                <div class="section-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                    <h2>Ordens de Serviço</h2>
                    <button onclick="limparBanco()" class="btn-danger">Esvaziar Banco</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>Aparelho</th>
                                <th>Descrição</th>
                                <th>Status</th>
                                <th>Ação</th>
                            </tr>
                        </thead>
                        <tbody id="table-body"></tbody>
                    </table>
                </div>
            </section>

            <section id="cadastro-screen" class="content-section hidden">
                <div class="form-card">
                    <h2>Nova Ordem</h2>
                    <form id="serviceForm">
                        <div class="input-group">
                            <label>Cliente</label>
                            <input type="text" id="cli-nome" required>
                        </div>
                        <div class="input-group">
                            <label>Aparelho</label>
                            <input type="text" id="apa-nome" required>
                        </div>
                        <div class="input-group">
                            <label>Defeito</label>
                            <textarea id="apa-defeito" required></textarea>
                        </div>
                        <div class="input-group">
                            <label>Data</label>
                            <input type="date" id="apa-data" required>
                        </div>
                        <div class="form-buttons">
                            <button type="button" onclick="showScreen('home-screen')" class="btn-secondary">Cancelar</button>
                            <button type="submit" class="btn-primary">Salvar Ordem</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <div id="custom-confirm" class="modal-overlay hidden">
        <div class="confirm-card">
            <div class="confirm-icon"><i class="fas fa-exclamation-triangle" id="modal-icon"></i></div>
            <h3 id="confirm-title">Atenção</h3>
            <p id="confirm-message"></p>
            <div class="confirm-buttons">
                <button id="confirm-no" class="btn-secondary" onclick="closeConfirm()">Cancelar</button>
                <button id="confirm-yes" class="btn-danger-confirm">Sim, Confirmar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
